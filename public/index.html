  .ask-log .a-bot div { padding: 10px 13px; border-radius: 14px 14px 14px 4px; background: var(--card); box-shadow: var(--shadow); font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
  .ask-log .a-bot.err div { color: #d33; }
  .ask-sugs { display: flex; flex-wrap: wrap; gap: 6px; }
  .ask-sugs button { border: 0; background: var(--card); color: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, var(--line));
    border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 500; transition: transform .15s, background .2s; }
  .ask-sugs button:hover { transform: translateY(-1px); background: var(--accent-bg); }
  .ask-form { display: flex; gap: 8px; }
  .ask-form input { flex: 1; min-width: 0; border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: 999px; padding: 10px 14px; font-size: 14px; background: var(--card); }
  .ask-form input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
  .ask-form button { border: 0; border-radius: 999px; padding: 0 16px; color: #fff; font-weight: 700; }
  .ask-form button:disabled { opacity: .5; }
  .ask-note { font-size: 11px; color: var(--muted); }

  /* ===== 日米の金利パネル（上の帯の中） ===== */
  .rates { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; padding-bottom: 16px; color: #fff; }
  .rate-card { border-radius: 16px; padding: 10px 14px 12px; background: rgba(255,255,255,.12); backdrop-filter: blur(8px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); min-width: 0; animation: rise .5s cubic-bezier(.2,.7,.2,1) both; }
  .rate-card:nth-child(2) { animation-delay: .08s; } .rate-card:nth-child(3) { animation-delay: .16s; }
  .rate-card h4 { margin: 0 0 6px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; font-family: "Zen Maru Gothic", sans-serif; }
  .rate-card h4 small { margin-left: auto; font-weight: 400; font-size: 10.5px; opacity: .75; }
  .rate-items { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .ri { min-width: 0; }
  .ri .k { font-size: 10.5px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ri .v { font-size: 20px; font-weight: 800; letter-spacing: .01em; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .ri .v small { font-size: 12px; font-weight: 600; opacity: .85; margin-left: 1px; }
  .ri .v.range { font-size: 16px; white-space: nowrap; }
  .flag { width: 20px; height: 14px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(255,255,255,.4); flex: none; }
  .ri .d { font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 2px; padding: 0 6px; border-radius: 99px; background: rgba(255,255,255,.14); }
  .ri .d.up { color: #ffd1dc; } .ri .d.down { color: #b9f6ff; } .ri .d.flat { color: rgba(255,255,255,.8); }
  .ri svg { display: block; width: 100%; height: 22px; margin-top: 4px; overflow: visible; }
  .ri svg polyline { fill: none; stroke: rgba(255,255,255,.9); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round;
    stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.4s .3s ease-out forwards; }
  .ri svg circle { fill: #fff; }
  .spread { display: flex; flex-direction: column; justify-content: center; text-align: center; min-width: 120px; }
  .spread .k { font-size: 11px; opacity: .85; }
  .spread .v { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .spread .s { font-size: 10.5px; opacity: .8; line-height: 1.5; }
  .rates-note { grid-column: 1 / -1; font-size: 10.5px; opacity: .75; margin-top: -2px; }
  .rates .sk { height: 88px; border-radius: 16px; background: rgba(255,255,255,.1); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (max-width: 860px) {
    .rates { grid-template-columns: 1fr 1fr; }
    .spread { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 12px; align-items: baseline; min-width: 0; }
  }
  @media (max-width: 560px) {
    .rates { grid-template-columns: 1fr; }
    .ri .v { font-size: 18px; }
  }

  /* ===== 今日のおすすめ5選 ===== */
  .picks { border-radius: 22px; padding: 16px; background: var(--card); box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .picks::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, #ff4d8d, #6d4aff, #2f7bff, #19c3d6); }
  .picks-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 2px 0 12px; }
  .picks-h h2 { margin: 0; font-size: 19px; font-weight: 900; }
  .picks-h small { font-size: 12px; color: var(--muted); }
  .picks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pk { position: relative; display: flex; gap: 12px; text-align: left; border: 0; border-radius: 16px; padding: 10px; background: color-mix(in srgb, var(--c) 6%, var(--card));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 18%, var(--line)); color: var(--text); cursor: pointer;
    transition: transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s; animation: rise .5s cubic-bezier(.2,.7,.2,1) both; }
  .pk:hover { transform: translateY(-3px); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, var(--line)), 0 14px 28px -16px color-mix(in srgb, var(--c) 70%, transparent); }
  .pk:nth-child(2) { animation-delay: .06s; } .pk:nth-child(3) { animation-delay: .12s; } .pk:nth-child(4) { animation-delay: .18s; } .pk:nth-child(5) { animation-delay: .24s; }
  .pk .num { position: absolute; left: -2px; top: -6px; z-index: 1; font-family: "Zen Maru Gothic", sans-serif; font-size: 30px; font-weight: 900; font-style: italic; line-height: 1;
    background: linear-gradient(180deg, var(--c), color-mix(in srgb, var(--c) 50%, #000)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 var(--card)); }
  .pk .ph { flex: none; width: 112px; height: 80px; border-radius: 12px; overflow: hidden; background: var(--line); position: relative; }
  .pk .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
  .pk:hover .ph img { transform: scale(1.07); }
  .pk .ph .vid { position: absolute; right: 6px; bottom: 6px; font-size: 10px; font-weight: 700; color: #fff; background: #dc2626; padding: 1px 6px; border-radius: 4px; }
  .pk .tx { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .pk .g { font-size: 11px; font-weight: 700; color: var(--c); }
  .pk .tt { font-size: 14px; font-weight: 700; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pk .why { font-size: 12.5px; color: var(--sub); line-height: 1.55; }
  .pk .why b { color: var(--c); margin-right: 4px; }
  /* 1位は大きく */
  .pk.first { grid-column: 1 / -1; padding: 12px; }
  .pk.first .ph { width: 220px; height: 132px; }
  .pk.first .tt { font-size: 17px; -webkit-line-clamp: 3; }
  .pk.first .num { font-size: 44px; }
  .pk.first .why { font-size: 13.5px; }
  .picks .sk-row { height: 84px; border-radius: 16px; background: linear-gradient(90deg, var(--line) 25%, var(--bg) 50%, var(--line) 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite linear; }
  @media (max-width: 720px) {
    .picks-grid { grid-template-columns: 1fr; }
    .pk.first .ph { width: 130px; height: 92px; }
    .pk.first .tt { font-size: 15px; }
  }

  /* ===== スマホ：ホーム画面から開いたとき（iPhone の切り欠きやホームバーをよける） ===== */
  .band { padding-top: env(safe-area-inset-top); }
  .chat-fab { bottom: calc(18px + env(safe-area-inset-bottom)); }
  .totop { bottom: calc(102px + env(safe-area-inset-bottom)); }
  .c-form, .m-scroll { padding-bottom: env(safe-area-inset-bottom); }

  /* ===== スマホで見る（QRコード） ===== */
  .phone-btn { border: 0; border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: #fff; background: rgba(255,255,255,.16);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); transition: background .2s, transform .15s; }
  .phone-btn:hover { background: rgba(255,255,255,.26); transform: translateY(-1px); }
  .phone { position: fixed; z-index: 22; left: 50%; top: 50%; width: min(380px, calc(100% - 32px)); padding: 22px; border-radius: 22px; text-align: center;
    background: var(--card); box-shadow: 0 30px 80px rgba(0,0,0,.3); opacity: 0; visibility: hidden; transform: translate(-50%, -46%) scale(.96);
    transition: opacity .25s, transform .35s cubic-bezier(.2,.9,.25,1.05), visibility 0s .35s; }
  .phone.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%); transition: opacity .25s, transform .35s cubic-bezier(.2,.9,.25,1.05); }
  .phone h3 { margin: 0 0 4px; font-size: 18px; font-family: "Zen Maru Gothic", sans-serif; }
  .phone p { margin: 6px 0; font-size: 13px; color: var(--sub); line-height: 1.7; }
  .phone .qr { display: inline-block; padding: 10px; border-radius: 16px; background: #fff; margin: 8px 0; box-shadow: var(--shadow); }
  .phone .qr svg { display: block; width: 200px; height: 200px; }
  .phone .url { font-family: ui-monospace, Consolas, monospace; font-size: 15px; font-weight: 700; color: var(--accent); word-break: break-all; }
  .phone ol { text-align: left; margin: 10px 0 0; padding-left: 1.3em; font-size: 13px; color: var(--sub); line-height: 1.8; }
  .phone .x { position: absolute; top: 10px; right: 10px; border: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--bg); font-size: 16px; }

  /* 動きを減らす設定の人には、アニメーションを止める */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  .m-wait .err { color: #d33; display: block; margin-top: 8px; }

  @media (max-width: 560px) {
    .list { grid-template-columns: 1fr; }
    .card img { width: 64px; height: 52px; }
    .status { width: 100%; margin-left: 0; }
    .modal { top: auto; bottom: 0; left: 0; width: 100%; max-height: 92vh; border-radius: 18px 18px 0 0; transform: translateY(40px); }
    .modal.show { transform: none; }
    .today { display: none; }
    .status { color: rgba(255,255,255,.85); }
    .m-head h2 { font-size: 16px; }
  }

  /* ===== 解説を読みやすく：1文ずつの段落・番号つきポイント・目次 ===== */
  .blk .para p { margin: 0 0 .6em; } .blk .para p:last-child { margin-bottom: 0; }
  .blk .pts { list-style: none; padding-left: 0; counter-reset: pt; }
  .blk .pts li { counter-increment: pt; position: relative; padding-left: 34px; }
  .blk .pts li::marker { content: none; }
  .blk .pts li::before { content: counter(pt); position: absolute; left: 0; top: .2em; width: 24px; height: 24px; border-radius: 50%;
    background: var(--c); color: #fff; font-size: 13px; font-weight: 800; line-height: 24px; text-align: center; }
  .sec-nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: -4px; }
  .sec-nav::-webkit-scrollbar { display: none; }
  .sec-nav button { flex: none; border: 0; border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 700; color: var(--text);
    background: color-mix(in srgb, var(--c) 10%, var(--card)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 25%, transparent); }
  .sec-nav button:active { transform: scale(.95); }

  /* ===== スマホ：記事を開いた画面を、画面いっぱいの読みやすい形にする ===== */
  @media (max-width: 560px) {
    /* 画面いっぱいに出す（100dvh はアドレスバーを除いた高さ。古いブラウザは 100% を使う） */
    .modal { top: 0; bottom: 0; left: 0; width: 100%; height: 100%; height: 100dvh; max-height: none; border-radius: 0;
      display: flex; flex-direction: column; transform: translateY(24px); }
    .modal.show { transform: none; }
    .m-scroll { flex: 1; min-height: 0; max-height: none; padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
    .modal > .close { top: calc(10px + env(safe-area-inset-top)); right: 10px; width: 40px; height: 40px; font-size: 22px; }
    .modal > .close:hover { transform: none; }
    /* タイトルは上に貼りつけない（読む場所を広くする） */
    .m-head { position: static; padding: calc(16px + env(safe-area-inset-top)) 16px 14px; backdrop-filter: none; }
    .m-cover { height: calc(150px + env(safe-area-inset-top)); }
    .m-cover + .m-head { position: relative; margin-top: 0; padding-top: 6px; }
    .m-head .meta { padding-right: 46px; line-height: 1.6; }
    .m-head h2 { font-size: 19px; line-height: 1.5; padding-right: 0; }
    .m-cover + .m-head h2 { padding-right: 0; }
    .m-head:first-child h2 { padding-right: 40px; }
    .m-actions .btn { flex: 1; justify-content: center; padding: 10px 12px; font-size: 14px; }
    /* 本文：文字を少し大きく、行間を広く */
    .m-body { padding: 18px 16px 8px; gap: 16px; }
    .hero { font-size: 16.5px; line-height: 1.7; padding: 14px 14px 14px 42px; }
    .blk h3 { font-size: 15px; margin-bottom: 10px; color: var(--text); font-weight: 800; }
    /* 解説の項目を1つずつカードにして、区切りをはっきりさせる */
    .blk.sec { padding: 14px 14px 16px; border-radius: 16px; background: color-mix(in srgb, var(--c) 4%, var(--card));
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 14%, var(--line)); }
    .blk.sec .bubble { margin: 0 -4px; }
    .bubble .copy { float: none; display: flex; margin: 0 0 8px auto; }
    /* 目次は横にスクロールさせず、折り返して全部見せる */
    .sec-nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; overflow: visible; margin-top: -6px; }
    .sec-nav button { padding: 8px 2px; font-size: 12.5px; text-align: center; white-space: nowrap; }
    .sec-nav .ic { display: none; }
    /* 記事の画面は縦にだけスクロールする（横にずれない・指で横に動かせない） */
    .modal, .m-scroll { overflow-x: hidden; touch-action: pan-y; }
    .m-body { grid-template-columns: minmax(0, 1fr); }
    .m-scroll * { max-width: 100%; }
    .m-body, .m-head { overflow-wrap: anywhere; }
    .blk li, .blk .pts li, .blk .para, .bubble { font-size: 16px; line-height: 1.9; }
    .blk .pts li { margin-bottom: 10px; }
    .view { font-size: 15px; line-height: 1.85; }
    .terms { grid-template-columns: 1fr; }
    .term { font-size: 14px; } .term b { font-size: 15px; }
    .ask { padding: 14px; }
    .ask-log .q-me, .ask-log .a-bot div { font-size: 15px; }
    .ask-sugs button { font-size: 14px; padding: 8px 12px; }
    .ask-form button { padding: 0 18px; }
    /* 検索欄は1行、その下に「期間・並び順・カテゴリ」を同じ幅で並べる（小さいスマホでもはみ出さない） */
    .search { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 8px; }
    /* おすすめ5選の1番は、写真を上・文字を下に（横に並べると文字の列が細くなりすぎる） */
    .pk.first { flex-direction: column; }
    .pk.first .ph { width: 100%; height: auto; aspect-ratio: 16 / 9; }
    .pk .ph { width: 96px; height: 70px; }
    /* コーチ・マイクのふきだしは、画面の幅に収まるように折り返す */
    .chat-fab .say { white-space: normal; width: max-content; max-width: calc(100vw - 120px); }
    .search input { grid-column: 1 / -1; }
    .search select { width: 100%; min-width: 0; padding: 9px 6px; text-overflow: ellipsis; }
    /* iPhone は 16px より小さい入力欄を押すと画面を勝手に拡大するので、16px にそろえる */
    input, select, textarea { font-size: 16px !important; }
  }
  /* とても小さいスマホ（iPhone SE など） */
  @media (max-width: 380px) {
    .pk .ph { width: 76px; height: 58px; }
    .pk .tt { font-size: 13.5px; }
    .wrap { padding-left: 12px; padding-right: 12px; }
  }

  /* =====================================================
     Finsight テーマ：濃紺 × 金。落ち着いた品のある見た目（この下がいちばん優先される）
     ===================================================== */
  :root {
    --bg: #f6f4ef; --card: #ffffff; --text: #14213d; --sub: #3d4657; --muted: #8a8f99; --line: #e6e1d6;
    --accent: #1e3a5f; --accent-bg: #edf0f4; --brand1: #0f2742; --brand2: #1e3a5f; --brand3: #b08d57; --gold: #b08d57; --navy: #0f2742;
    --star: #a87a2a; --star-bg: #f7f0e1;
    --g-policy: #2f5d8a; --g-market: #9b3d3d; --g-invest: #3f7a5a; --g-world: #5d4f8a;
    --g-finance: #2f7a85; --g-life: #a0782f; --g-company: #8a4f6b;
    --shadow: 0 1px 2px rgba(20,33,61,.05), 0 8px 24px -14px rgba(20,33,61,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1119; --card: #121a25; --text: #ebe7df; --sub: #c3c0b8; --muted: #8b8f97; --line: #243042;
      --accent: #c9a96e; --accent-bg: #1c2633; --brand1: #0f2742; --brand2: #1e3a5f; --brand3: #c9a96e; --gold: #c9a96e;
      --star: #d9b26a; --star-bg: #2b2416;
      --g-policy: #7fa6cf; --g-market: #d08a8a; --g-invest: #8fbf9f; --g-world: #a99bd3;
      --g-finance: #7fc0c8; --g-life: #d6b06a; --g-company: #cf9bb5;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.6); }
  }
  body { background: var(--bg); }
  /* 見出しは明朝体で、新聞・経済誌のような落ち着きを出す */
  h2, h3, .hero, .picks-h h2, .ask-h, .c-head b, .rk .t, .phone h3 { font-family: "Shippori Mincho", "Yu Mincho", serif; letter-spacing: .02em; }
  section > h2, .picks-h h2 { font-weight: 800; }
  .wordmark { font-family: "Cormorant Garamond", "Times New Roman", serif; font-size: 30px; font-weight: 700; letter-spacing: .02em; line-height: 1; }
  .wordmark em { color: #d8b878; font-style: italic; font-weight: 600; }
  .tagline { font-family: "Shippori Mincho", serif; font-size: 12px; letter-spacing: .12em; color: rgba(255,255,255,.78); margin-top: 3px; }

  /* 上の帯：濃紺の無地に、細い金の線 */
  .band { background: linear-gradient(165deg, #0b1d33 0%, #13294a 60%, #0f2742 100%); animation: none; border-bottom: 1px solid #b08d57; }
  .band::before { display: none; }
  .band::after { background: radial-gradient(700px 160px at 90% -30%, rgba(216,184,120,.16), transparent 70%); }
  .logo { background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(216,184,120,.45); }
  .views { background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .views button[aria-pressed="true"] { background: #f6f4ef; color: #0f2742; }
  .status .pulse { background: #d8b878; animation: none; box-shadow: none; }

  /* ボタン・選択中の印：グラデーションをやめて、濃紺の無地に */
  .chip[aria-pressed="true"], .btn.primary, .msg.me, .c-form button, .ask-form button, .pick-badge { background: var(--navy); color: #fff; box-shadow: none; }
  @media (prefers-color-scheme: dark) {
    .chip[aria-pressed="true"], .btn.primary, .msg.me, .c-form button, .ask-form button, .pick-badge { background: var(--gold); color: #10161f; }
  }
  .new { background: var(--gold); animation: none; }
  .hot { background: #9b3d3d; }
  .meter .bar i { background: linear-gradient(90deg, var(--navy), var(--gold)); }
  .picks::before { height: 3px; background: linear-gradient(90deg, var(--navy), var(--gold), var(--navy)); }
  .hero { background: color-mix(in srgb, var(--gold) 9%, var(--card)); box-shadow: inset 3px 0 0 var(--gold); border-radius: 12px; }
  .hero::after { display: none; }
  .ask { background: color-mix(in srgb, var(--navy) 4%, var(--card)); box-shadow: inset 0 0 0 1px var(--line); }
  .sec-nav button { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }

  /* コーチ・マイクのチャット */
  .chat-fab { background: radial-gradient(circle at 30% 25%, #fff, #f1ece1); box-shadow: 0 12px 26px -10px rgba(15,39,66,.55), inset 0 0 0 2px #d8b878; }
  .c-head { background: linear-gradient(165deg, #0b1d33, #1e3a5f); animation: none; border-bottom: 1px solid #b08d57; }
  .c-item:hover { border-color: var(--gold); box-shadow: 0 6px 16px -10px rgba(15,39,66,.4); }
  .c-item .k { background: var(--navy); }
  .c-item .k.v { background: #9b3d3d; }
  .c-sugs button, .ask-sugs button { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); color: var(--accent); background: var(--card); box-shadow: none; }
  .c-sugs button:hover, .ask-sugs button:hover { background: color-mix(in srgb, var(--gold) 10%, var(--card)); }
  .c-form input:focus, .ask-form input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 22%, transparent); }

  /* ===== ドル円（金利の右に、日米金利差と横に並べる） ===== */
  .fx-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-width: 290px; }
  .fx .ri .v { font-size: 22px; }
  .fx-col .spread { min-width: 0; }
  @media (max-width: 860px) {
    .fx-col { grid-column: 1 / -1; min-width: 0; }
    .fx-col .spread { grid-column: auto; flex-direction: column; justify-content: center; gap: 0; align-items: center; }
  }

  /* ===== 絞り込み：「お客様のタイプ」「ジャンル」はボタンにして、タップで一覧を開く ===== */
  .fbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fbtn { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; text-align: left; border: 0; border-radius: 12px; padding: 8px 12px;
    background: var(--card); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; transition: box-shadow .2s, transform .15s; }
  .fbtn:active { transform: scale(.98); }
  .fbtn .fk { grid-column: 1; font-size: 11px; font-weight: 700; color: var(--muted); }
  .fbtn .fv { grid-column: 1; font-size: 14px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fbtn .car { grid-column: 2; grid-row: 1 / span 2; align-self: center; color: var(--muted); transition: transform .25s; }
  .fbtn.on { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--gold) 70%, var(--line)); }
  .fbtn[aria-expanded="true"] { box-shadow: inset 0 0 0 2px var(--gold); }
  .fbtn[aria-expanded="true"] .car { transform: rotate(180deg); }
  .fpanel { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border-radius: 14px; background: var(--card);
    box-shadow: var(--shadow), inset 0 0 0 1px var(--line); animation: rise .25s cubic-bezier(.2,.7,.2,1) both; }
</style>
</head>
<body>
<header>
  <div class="band">
   <div class="wrap">
    <div class="row top">
      <div class="brand">
        <span class="logo" id="logo" aria-hidden="true"></span>
        <div><h1 class="wordmark">Fin<em>sight</em></h1><div class="tagline">ニュースから、気づきを。</div><div class="today" id="today"></div></div>
      </div>
      <div class="views" id="views">
        <button data-view="news" aria-pressed="true">ニュース</button>
        <button data-view="saved" aria-pressed="false">★ 保存<span id="savedCount"></span></button>
      </div>
      <button class="phone-btn" id="phoneBtn" hidden>📱 スマホで見る</button>
      <span class="status" id="status">読み込み中…</span>
    </div>
    <div class="rates" id="rates" aria-label="日本とアメリカの金利"><div class="sk"></div><div class="sk"></div></div>
   </div>
  </div>
  <div class="wrap">
    <div class="row search">
      <input id="q" type="search" placeholder="キーワードでさがす">
      <select id="period" class="news-only" aria-label="期間">
        <option value="1">今日</option>
        <option value="3">3日</option>
        <option value="7">1週間</option>
        <option value="31" selected>1か月</option>
        <option value="all">すべて</option>
      </select>
      <select id="sort" aria-label="並び順">
        <option value="rec" selected>おすすめ順</option>
        <option value="new">新しい順</option>
        <option value="picks">注目順</option>
      </select>
      <select id="cat" class="news-only" aria-label="カテゴリ"><option value="market">金融・経済</option></select>
    </div>
    <div class="filters" id="filters"></div>
  </div>
</header>
<main class="wrap" id="list"></main>

<div class="shade" id="shade"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"></div>
<div class="toast" id="toast" role="status"></div>
<div class="phone" id="phone" role="dialog" aria-label="スマホで見る"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<button class="totop" id="totop" aria-label="上に戻る">↑</button>
<button class="chat-fab" id="chatFab" aria-label="コーチ・マイクに聞く"><span class="say">Hey！お金のこと、なんでも聞いてくれ！</span><span id="fabOwl"></span></button>
<div class="chat" id="chat" role="dialog" aria-label="AIアシスタント">
  <div class="c-head">
    <span class="av" id="chatAv"></span>
    <div><b>コーチ・マイク</b><small>元アメフト選手の「お金のコーチ」。質問に答えて、記事や動画も探すぜ！</small></div>
    <button class="x" id="chatClose" aria-label="閉じる">×</button>
  </div>
  <div class="c-log" id="chatLog"></div>
  <form class="c-form" id="chatForm">
    <input id="chatInput" placeholder="例：老後のお金が不安" autocomplete="off" maxlength="200">
    <button id="chatSend">送信</button>
  </form>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  // =====================================================================
  // データの取り方の切りかえ
  //   PC 版（npm start）     … これまでどおり、PC のサーバー（/api/...）に聞く
  //   スマホ版（静的サイト） … data/ の JSON ファイル・スマホの保存領域・Cloudflare の関数を使う
  // 画面の残りの部分は、どちらでも同じ形のデータを受け取れるようにしてある
  // =====================================================================
  const STATIC = window.APP_MODE === "static";
  const fakeResponse = (data, status = 200) => ({ ok: status < 300, status, json: async () => data });
  const store = {
    get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
  };
  const fileCache = new Map();
  async function getData(path) {
    if (!fileCache.has(path)) fileCache.set(path, fetch(path, { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error(`データを読み込めませんでした（${path}）`); return r.json(); }).catch((e) => { fileCache.delete(path); throw e; }));
    return fileCache.get(path);
  }
  const refreshData = () => { for (const k of [...fileCache.keys()]) if (!k.includes("/ex/")) fileCache.delete(k); };
  async function callFunction(path, body) {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({ error: "うまくいきませんでした" }));
    if (!r.ok) throw new Error(d.error || "うまくいきませんでした");
    return d;
  }
  // 解説：一覧には「ひとこと」だけ入っていて、全文は開いたときに data/ex/番号.json から読む
  function bucketOf(id, n) { let h = 5381; for (const ch of String(id)) h = ((h * 33) ^ ch.charCodeAt(0)) >>> 0; return h % n; }
  // その場で作った急ぎの解説（スマホに残したもの）より、定期更新で丁寧に作った解説を優先する
  async function fullExplanation(id) {
    const meta = await getData("data/meta.json");
    const shared = (await getData(`data/ex/${bucketOf(id, meta.buckets)}.json`))[id];
    return shared || store.get("localEx", {})[id] || null;
  }
  // 動画の概要欄（一覧には入れていない）を足す。AI がタイトルだけで中身を想像しないように
  async function withVideoSummary(n) {
    if (!n || n.kind !== "video" || n.summary) return n;
    const meta = await getData("data/meta.json");
    const summary = (await getData(`data/vs/${bucketOf(n.id, meta.buckets)}.json`).catch(() => ({})))[n.id] || "";
    return { ...n, summary };
  }
  // 静的データの記事を、画面が使う形（PC 版の /api/news と同じ形）にそろえる
  function shape(n) {
    const saved = store.get("savedItems", {});
    const local = store.get("localEx", {})[n.id];
    const explanation = n.oneLine ? { oneLine: n.oneLine, partial: true } : local || null;
    return { ...n, explanation, saved: !!saved[n.id], savedAt: saved[n.id]?.savedAt || null };
  }
  // チャット用：記事・動画を言葉で探す（PC 版のサーバーと同じ考え方）
  function searchItems(all, query, keywords, kind) {
    const STOP = new Set([..."のをにがはでとてたいるもやかなしだですますこれそれあのこと"]);
    const t = query.replace(/[\s、。！？!?「」（）()・,.\-—]/g, "");
    const grams = new Set();
    for (let i = 0; i < t.length - 1; i++) if (!STOP.has(t[i]) || !STOP.has(t[i + 1])) grams.add(t.slice(i, i + 2));
    const scored = [];
    for (const n of all) {
      if (kind === "video" && n.kind !== "video") continue;
      if (kind === "news" && n.kind === "video") continue;
      const head = `${n.title} ${n.oneLine || ""}`;
      let score = 0;
      for (const k of keywords) { if (n.title.includes(k)) score += 4; else if (head.includes(k)) score += 3; }
      let overlap = 0;
      for (const g of grams) if (head.includes(g)) overlap++;
      score += Math.min(overlap, 6) * 0.5;
      if (score <= 0) continue;
      score += Math.max(0, 1 - (Date.now() - new Date(n.publishedAt)) / 86400000 / 60) * 0.8;
      scored.push({ n, score });
    }
    return scored.sort((a, b) => b.score - a.score).slice(0, 15).map((x) => x.n);
  }

  async function apiFetch(url, opts = {}) {
    if (!STATIC) return fetch(url, opts);
    const u = new URL(url, location.href);
    const method = (opts.method || "GET").toUpperCase();
    const body = opts.body ? JSON.parse(opts.body) : {};
    try {
      const meta = await getData("data/meta.json");
      const base = { genres: meta.genres, audiences: meta.audiences, keepDays: meta.keepDays, ai: { enabled: true, queued: 0 } };
      switch (u.pathname) {
        case "/api/categories": return fakeResponse(meta.categories);
        case "/api/rates": return fakeResponse(await getData("data/rates.json"));
        case "/api/lan": return fakeResponse({ urls: [] });
        case "/api/picks": {
          const p = await getData("data/picks.json");
          return fakeResponse({ ...p, items: (p.items || []).map(shape) });
        }
        case "/api/news": {
          if (u.searchParams.has("refresh")) refreshData();
          const cat = u.searchParams.get("category") || meta.defaultCategory;
          const d = await getData(`data/list-${cat}.json`);
          return fakeResponse({ ...base, fetchedAt: d.updatedAt, warning: d.note, items: d.items.map(shape) });
        }
        case "/api/saved": {
          const saved = store.get("savedItems", {});
          if (method === "GET") {
            const list = Object.values(saved).map((x) => ({ ...shape(x.item), saved: true, savedAt: x.savedAt, explanation: x.explanation || shape(x.item).explanation }))
              .sort((a, b) => new Date(b.savedAt) - new Date(a.savedAt));
            return fakeResponse({ ...base, items: list });
          }
          const id = String(body.id);
          if (method === "DELETE") delete saved[id];
          else {
            const n = findItem(id);
            if (!n) throw new Error("記事が見つかりません");
            const { explanation, saved: _s, savedAt: _a, reason: _r, ...item } = n;
            saved[id] = { item, explanation: explanation?.partial ? await fullExplanation(id) || explanation : explanation, savedAt: new Date().toISOString() };
          }
          store.set("savedItems", saved);
          return fakeResponse({ ok: true });
        }
        case "/api/explain": {
          const n = await withVideoSummary(findItem(body.id));
          const e = await callFunction("/api/explain", { item: n });
          const localEx = store.get("localEx", {});
          localEx[String(body.id)] = e;
          const keys = Object.keys(localEx);
          if (keys.length > 300) delete localEx[keys[0]]; // スマホに残すのは300件まで
          store.set("localEx", localEx);
          return fakeResponse(e);
        }
        case "/api/ask": {
          const n = await withVideoSummary(findItem(body.id));
          const e = n?.explanation?.partial ? await fullExplanation(String(body.id)) : n?.explanation;
          return fakeResponse(await callFunction("/api/ask", { item: n, explanation: e, messages: body.messages }));
        }
        case "/api/chat": {
          const history = body.messages || [];
          const query = history.filter((m) => m.role === "user").at(-1)?.content || "";
          let kw = { keywords: [query], kind: "any" };
          try {
            const k = await callFunction("/api/chat", { action: "keywords", messages: history });
            if (k.keywords?.length) kw = { keywords: [...new Set([...k.keywords, query])], kind: k.kind };
          } catch {}
          const all = await getData("data/search.json");
          const candidates = searchItems(all, query, kw.keywords, kw.kind);
          // 質問への答えと、おすすめ選びを同時に頼む（待ち時間を短くする）
          const [ans, r] = await Promise.all([
            callFunction("/api/chat", { action: "answer", messages: history, candidates }).then((x) => x.answer || "").catch(() => ""),
            candidates.length
              ? callFunction("/api/chat", { action: "choose", messages: history, candidates })
                .catch(() => ({ reply: "関係がありそうな記事や動画を探しました。", picks: candidates.slice(0, 5).map((_, index) => ({ index, reason: "" })) }))
              : { reply: "", picks: [] },
          ]);
          if (!ans && !r.picks.length) return fakeResponse({ answer: "", reply: "ごめんなさい、合いそうな記事や動画が見つかりませんでした。別の言葉で聞いてみてください。", items: [] });
          return fakeResponse({ answer: ans, reply: r.reply, items: r.picks.map((p) => ({ ...shape(candidates[p.index]), reason: p.reason })) });
        }
      }
      return fakeResponse({ error: "見つかりません" }, 404);
    } catch (e) {
      return fakeResponse({ error: e.message }, 500);
    }
  }

  // スマホ版：解説を開いたら、全文を読み込んでから表示する
  async function loadFullFor(id) {
    const n = findItem(id);
    if (!STATIC || !n?.explanation?.partial) return;
    const full = await fullExplanation(String(id)).catch(() => null);
    for (const x of pool()) if (sameId(x, id) && x.explanation?.partial) x.explanation = full || { ...x.explanation, partial: false, missing: true };
    if (String(current) === String(id)) renderModal();
  }
  let items = [];
  let savedItems = [];
  let genres = [];
  let audiences = [];
  let view = "news";     // "news" | "saved"
  let genre = "all";     // 選択中のジャンル
  let openFilter = null; // 一覧を開いている絞り込み（"aud" か "genre"。閉じているときは null）
  let audience = "all";  // 選択中の対象（だれ向け）
  let warning = null;
  let ai = { enabled: false, queued: 0 };
  let current = null;    // ポップアップで開いている記事ID
  let animateNext = true; // 次の描画でカードを順番にふわっと出すか（裏での自動更新では動かさない）
  let modalFresh = false; // ポップアップを開いた直後だけ中身を順番に出す
  let burstId = null;     // ☆を押した直後の記事ID（星をはじけさせる）
  const making = new Map(); // 記事ID → "loading" | エラーメッセージ
  try { audience = localStorage.getItem("audience") || "all"; } catch {}

  // ===== コーチ・マイク（オリジナルキャラクター）：テキサス出身の元アメフト選手で、今は「お金のコーチ」 =====
  // 金髪にヘッドバンド、ホイッスルを首にかけた体育会系。考え中はガッツポーズ（.talk）、ときどきまばたきする
  function mascot(cls = "") {
    return `<svg class="mascot ${cls}" viewBox="0 0 64 64" aria-hidden="true">
      <g class="wing-l"><path d="M14 56 L7 41" stroke="#c8102e" stroke-width="5.5" stroke-linecap="round"/><circle cx="6.5" cy="38.5" r="4.2" fill="#f2c29b"/></g>
      <g class="wing-r"><path d="M50 56 L57 41" stroke="#c8102e" stroke-width="5.5" stroke-linecap="round"/><circle cx="57.5" cy="38.5" r="4.2" fill="#f2c29b"/></g>
      <path d="M11 64 Q12 50 32 49.5 Q52 50 53 64 Z" fill="#c8102e"/>
      <path d="M26.5 49.8 L32 56.5 L37.5 49.8 Z" fill="#fff"/>
      <path d="M17 58 h7 M40 58 h7" stroke="#fff" stroke-width="1.6"/>
      <path d="M25 49 Q32 55 39 49" stroke="#facc15" stroke-width="1.3" fill="none"/>
      <rect x="35.5" y="51" width="6.5" height="3.6" rx="1.6" fill="#cbd5e1" stroke="#94a3b8" stroke-width=".6"/>
      <circle cx="14.6" cy="31" r="3.4" fill="#f2c29b"/><circle cx="49.4" cy="31" r="3.4" fill="#f2c29b"/>
      <ellipse cx="32" cy="30.5" rx="17" ry="18" fill="#f8d3b0"/>
      <path d="M15.2 25 Q14 8 32 7 Q50 8 48.8 25 L46.5 15.5 L42.5 21 L39 12.5 L35 19.5 L31.5 11.5 L27.5 19.5 L24 13 L20.5 20.5 L18 16 Z" fill="#f6c343"/>
      <rect x="14.6" y="19.2" width="34.8" height="5.6" rx="2.8" fill="#1d4ed8"/>
      <path d="M32 19.9 l1.05 2.15 2.35.33-1.7 1.65.4 2.35L32 25.3l-2.1 1.13.4-2.35-1.7-1.65 2.35-.33Z" fill="#fff" transform="translate(0 -1.2) scale(1)"/>
      <path d="M20.5 27.3 L28 25.6 M43.5 27.3 L36 25.6" stroke="#b7862b" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="25" cy="31" rx="2.5" ry="3" fill="#1d1b2f"/><ellipse cx="39" cy="31" rx="2.5" ry="3" fill="#1d1b2f"/>
      <circle cx="25.9" cy="29.9" r=".9" fill="#fff"/><circle cx="39.9" cy="29.9" r=".9" fill="#fff"/>
      <ellipse class="lid" cx="25" cy="31" rx="3" ry="3.5" fill="#f8d3b0"/><ellipse class="lid" cx="39" cy="31" rx="3" ry="3.5" fill="#f8d3b0"/>
      <ellipse cx="19.8" cy="37" rx="2.6" ry="1.5" fill="#ff8fa3" opacity=".5"/><ellipse cx="44.2" cy="37" rx="2.6" ry="1.5" fill="#ff8fa3" opacity=".5"/>
      <path d="M23.5 37.2 Q32 47.5 40.5 37.2 Z" fill="#7a1f2b"/>
      <path d="M24.8 37.6 Q32 40.4 39.2 37.6 L38.6 39.3 Q32 41.6 25.4 39.3 Z" fill="#fff"/>
      <path d="M28.5 43.3 Q32 45.2 35.5 43.3" stroke="#ff8fa3" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>`;
  }


  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const color = (id) => `var(--g-${id})`;
  const genreLabel = (id) => genres.find((g) => g.id === id)?.label || "";
  const audLabel = (id) => audiences.find((a) => a.id === id)?.label || "";
  // 記事IDは NewsPicks は数字、YouTube は文字列なので、文字列にそろえて比べる
  const sameId = (n, id) => String(n.id) === String(id);
  let chatItems = []; // チャットで紹介した記事・動画（ほかのカテゴリのものも含む）
  let picks = null;    // 今日のおすすめ5選（{ date, byAi, items }）
  const pool = () => [...items, ...savedItems, ...chatItems, ...(picks?.items || [])];
  const findItem = (id) => pool().find((n) => sameId(n, id));
  const score = (n) => n.pickCount ?? n.views ?? -1; // 注目度（NewsPicks は Pick 数、YouTube は再生回数）
  const fmtViews = (v) => (v >= 10000 ? `${Math.round(v / 1000) / 10}万回` : `${v}回`);
  // 文章を「。」で区切って箇条書きにする
  const sentences = (t) => String(t || "").split(/(?<=[。！？])\s*/).map((s) => s.trim()).filter(Boolean);

  const isNew = (n) => Date.now() - new Date(n.publishedAt) < 6 * 3600 * 1000;

  // ===== 既読の記録（このブラウザだけに残る） =====
  const ymd = (d) => new Date(d).toLocaleDateString("sv-SE"); // 2026-10-18 の形
  let readMap = {};
  let streak = { last: null, count: 0 };
  try { readMap = JSON.parse(localStorage.getItem("read") || "{}"); streak = JSON.parse(localStorage.getItem("streak") || "null") || streak; } catch {}
  const isRead = (n) => !!readMap[String(n.id)];
  function markRead(id) {
    const key = String(id);
    const first = !readMap[key];
    readMap[key] = Date.now();
    for (const [k, t] of Object.entries(readMap)) if (Date.now() - t > 40 * 86400000) delete readMap[k];
    const today = ymd(Date.now());
    if (streak.last !== today) {
      const yesterday = ymd(Date.now() - 86400000);
      streak = { last: today, count: streak.last === yesterday ? streak.count + 1 : 1 };
      if (streak.count >= 2) setTimeout(() => toast(`🔥 ${streak.count}日連続で読んでいます！`), 600);
    }
    try { localStorage.setItem("read", JSON.stringify(readMap)); localStorage.setItem("streak", JSON.stringify(streak)); } catch {}
    return first;
  }

  // 注目度が上位の記事（🔥マーク用）
  let hotIds = new Set();
  function computeHot(list) {
    const scores = list.map(score).filter((v) => v > 0).sort((a, b) => b - a);
    const line = scores[Math.max(0, Math.floor(scores.length * 0.15) - 1)] ?? Infinity;
    hotIds = new Set(list.filter((n) => score(n) > 0 && score(n) >= line).map((n) => String(n.id)));
  }


  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  function ago(iso) {
    const m = Math.floor((Date.now() - new Date(iso)) / 60000);
    if (m < 1) return "たった今";
    if (m < 60) return `${m}分前`;
    if (m < 1440) return `${Math.floor(m / 60)}時間前`;
    if (m < 43200) return `${Math.floor(m / 1440)}日前`;
    return new Date(iso).toLocaleDateString("ja-JP");
  }

  // ===== 絞り込み =====
  function base() {
    if (view === "saved") return savedItems;
    if ($("period").value === "all") return items;
    const days = Number($("period").value);
    const from = days === 1 ? new Date().setHours(0, 0, 0, 0) : Date.now() - days * 86400000;
    return items.filter((n) => new Date(n.publishedAt).getTime() >= from);
  }

  function filtered() {
    const q = $("q").value.trim().toLowerCase();
    let list = base().filter((n) => (audience === "all" || n.audiences?.includes(audience)) && (!q ||
      (n.title + n.summary + n.publisher + (n.explanation?.oneLine || "")).toLowerCase().includes(q)));
    if ($("sort").value === "picks") list = [...list].sort((a, b) => score(b) - score(a));
    if ($("sort").value === "new") list = [...list].sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
    if ($("sort").value === "rec") {
      const rec = recommend(list);
      list = [...list].sort((a, b) => rec.get(String(b.id)) - rec.get(String(a.id)));
    }
    return list;
  }

  // おすすめ度：新しさ・注目度（同じ媒体やチャンネルの中で比べる）・まだ読んでいないか・解説があるか
  let recIds = new Set();
  function recommend(list) {
    const maxBy = {};
    for (const n of list) maxBy[n.publisher] = Math.max(maxBy[n.publisher] || 1, score(n));
    const rec = new Map(list.map((n) => {
      const ageDays = (Date.now() - new Date(n.publishedAt)) / 86400000;
      const fresh = Math.exp(-ageDays / 10);
      const pop = score(n) > 0 ? Math.log1p(score(n)) / Math.log1p(maxBy[n.publisher]) : 0;
      return [String(n.id), 0.45 * fresh + 0.35 * pop + (isRead(n) ? 0 : 0.12) + (n.explanation ? 0.05 : 0)];
    }));
    const top = [...rec.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5); // 「おすすめ」マークは上位5件だけ
    recIds = new Set(top.map(([id]) => id));
    return rec;
  }

  // ジャンルごとに最初は少しだけ見せて、「もっと見る」で増やす
  const shown = new Map();
  const firstCount = () => (genre === "all" && !$("q").value.trim() ? 4 : 12);
  const resetShown = () => shown.clear();

  // ===== 一覧 =====
  function cardHtml(n) {
    const e = n.explanation;
    const gist = e
      ? `<p class="gist">${esc(e.oneLine)}</p>`
      : `<p class="gist none">${making.get(String(n.id)) === "loading" ? `AIが解説を書いています <span class="dots"><span></span><span></span><span></span></span>` : "解説はまだありません"}</p>`;
    return `
      <article class="card${n.kind === "video" ? " video" : ""}${isRead(n) ? " read" : ""}" data-id="${n.id}" style="--c:${color(n.genre)}" tabindex="0">
        <div class="body">
          <div class="meta"><b>${esc(genreLabel(n.genre))}</b> ・ ${n.kind === "video" ? "▶ 動画 ・ " : ""}${esc(n.publisher)} ・ ${ago(n.publishedAt)}${n.views != null ? ` ・ ${fmtViews(n.views)}再生` : ""}${n.paid ? " ・ 有料" : ""}${isRead(n) ? ` ・ <span class="readmark">✓ 読んだ</span>` : ""}</div>
          <h3>${$("sort").value === "rec" && recIds.has(String(n.id)) ? `<span class="pick-badge">おすすめ</span>` : ""}${isNew(n) ? `<span class="new">NEW</span>` : ""}${hotIds.has(String(n.id)) ? `<span class="hot">🔥 注目</span>` : ""}${esc(n.title)}</h3>
          ${gist}
        </div>
        <div class="side">
          ${n.image ? `<span class="thumb"><img src="${esc(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer"></span>` : ""}
          <button class="star${burstId === String(n.id) ? " burst" : ""}" data-star="${n.id}" aria-pressed="${n.saved}" title="${n.saved ? "保存をやめる" : "保存する"}">${n.saved ? "★" : "☆"}</button>
        </div>
      </article>`;
  }

  function renderFilters(list) {
    const src = base();
    const audCount = (id) => src.filter((n) => id === "all" || n.audiences?.includes(id)).length;
    const gCount = (id) => list.filter((n) => n.genre === id).length;
    const aud = [{ id: "all", label: "すべてのお客様", icon: "👥", hint: "" }, ...audiences]
      .map((a) => `<button class="chip" data-aud="${a.id}" aria-pressed="${audience === a.id}" title="${esc(a.hint)}"><span class="ic">${a.icon}</span>${esc(a.label)}<span class="n">${audCount(a.id)}</span></button>`).join("");
    const gen = [{ id: "all", label: "すべて", icon: "✨", hint: "" }, ...genres.filter((g) => gCount(g.id))]
      .map((g) => `<button class="chip" data-genre="${g.id}" aria-pressed="${genre === g.id}" title="${esc(g.hint)}" style="--c:${g.id === "all" ? "var(--muted)" : color(g.id)}">
        <span class="ic">${g.icon}</span>${esc(g.label)}<span class="n">${g.id === "all" ? list.length : gCount(g.id)}</span></button>`).join("");
    // ふだんは「お客様のタイプ」「ジャンル」の2つのボタンだけ。タップすると、その一覧が下に開く
    const curAud = audiences.find((a) => a.id === audience) || { icon: "👥", label: "すべて" };
    const curGen = genres.find((g) => g.id === genre) || { icon: "✨", label: "すべて" };
    const fbtn = (key, title, cur, on) => `<button class="fbtn${on ? " on" : ""}" data-fopen="${key}" aria-expanded="${openFilter === key}">
        <span class="fk">${title}</span><span class="fv">${cur.icon} ${esc(cur.label)}</span><span class="car" aria-hidden="true">▾</span></button>`;
    $("filters").innerHTML = `
      <div class="fbar">${fbtn("aud", "お客様のタイプ", curAud, audience !== "all")}${fbtn("genre", "ジャンル", curGen, genre !== "all")}</div>
      ${openFilter ? `<div class="fpanel">${openFilter === "aud" ? aud : gen}</div>` : ""}`;
  }

  function render() {
    document.querySelectorAll(".news-only").forEach((el) => (el.style.display = view === "saved" ? "none" : ""));
    $("views").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.view === view));
    $("savedCount").textContent = savedItems.length ? ` ${savedItems.length}` : "";
    if (audience !== "all" && !audiences.some((a) => a.id === audience)) audience = "all";
    const list = filtered();
    if (genre !== "all" && !list.some((n) => n.genre === genre)) genre = "all";
    renderFilters(list);
    const groups = (genre === "all" ? genres : genres.filter((g) => g.id === genre))
      .map((g) => ({ ...g, items: list.filter((n) => n.genre === g.id) }))
      .filter((g) => g.items.length);
    computeHot(list);
    const showSpot = view === "news" && genre === "all" && !$("q").value.trim() && list.length > 0;
    const spot = showSpot ? spotHtml(list) : "";
    const warn = (view === "news" && warning ? `<p class="warn">${esc(warning)}</p>` : "") + spot;
    const empty = view === "saved" && !savedItems.length
      ? "まだ保存した記事はありません。記事の ☆ を押すと、ここにずっと残ります"
      : "該当する記事がありません";
    $("list").innerHTML = warn + (groups.length ? groups.map((g) => `
      <section data-g="${g.id}" style="--c:${color(g.id)}; --icon:'${g.icon || "•"}'">
        <h2>${esc(g.label)}<span class="n">${g.items.length}件</span></h2>
        <div class="list">${g.items.slice(0, shown.get(g.id) || firstCount()).map(cardHtml).join("")}</div>
        ${g.items.length > (shown.get(g.id) || firstCount())
          ? `<button class="more" data-more="${g.id}">${esc(g.label)}をもっと見る（あと${g.items.length - (shown.get(g.id) || firstCount())}件）</button>` : ""}
      </section>`).join("") : `<div class="empty">${empty}</div>`);
    if (animateNext) {
      document.querySelectorAll("#list .card").forEach((c, i) => { c.classList.add("enter"); c.style.setProperty("--i", Math.min(i, 14)); });
      animateNext = false;
    }
    if (current) renderModal();
  }

  // ===== 注目エリア =====
  function spotHtml(list) {
    const readCount = list.filter(isRead).length;
    const pct = Math.round((readCount / list.length) * 100);
    const meter = `<div class="meter">
        <span class="txt">この一覧の<b>${list.length}</b>本中 <b>${readCount}</b>本を読みました</span>
        <span class="bar"><i style="--p:${pct}%"></i></span>
        ${streak.count >= 1 && streak.last === ymd(Date.now()) ? `<span class="streak">🔥 ${streak.count}日連続</span>` : `<span class="streak">今日の1本目を読もう</span>`}
      </div>`;
    const recent = list.filter((n) => Date.now() - new Date(n.publishedAt) < 3 * 86400000 && score(n) > 0);
    const top = (recent.length >= 3 ? recent : list).filter((n) => score(n) > 0).sort((a, b) => score(b) - score(a)).slice(0, 5);
    const rank = top.length ? `<div>
        <h2>いま注目のトップ${top.length} <small>${list.some((n) => n.kind === "video") ? "再生回数" : "Pick数"}が多い順</small></h2>
        <div class="rank">${top.map((n, i) => `
          <button class="rk" data-open="${n.id}">
            ${n.image ? `<img src="${esc(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
            <span class="veil"></span><span class="no">${i + 1}</span>
            <span class="in">
              <span class="hot">${n.pickCount != null ? `${n.pickCount} Picks` : n.views != null ? `${fmtViews(n.views)}再生` : ""}</span>
              <span class="t">${esc(n.title)}</span>
            </span>
          </button>`).join("")}</div>
      </div>` : "";
    return `<div class="spot">${picksHtml()}${meter}${rank}</div>`;
  }

  // 今日のおすすめ5選（カテゴリに関係なく、ニュースと動画の中から AI が選ぶ）
  function picksHtml() {
    if (!picks) return `<div class="picks"><div class="picks-h"><h2>📌 今日のおすすめ5選</h2><small>コーチ・マイクが選んでいます…</small></div>
      <div class="picks-grid">${'<div class="sk-row" style="grid-column:1/-1;height:130px"></div>' + '<div class="sk-row"></div>'.repeat(4)}</div></div>`;
    if (!picks.items.length) return "";
    const d = new Date(picks.createdAt);
    return `<div class="picks">
      <div class="picks-h"><h2>📌 今日のおすすめ5選</h2>
        <small>${d.getMonth() + 1}月${d.getDate()}日 ${d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })} に${picks.byAi ? "コーチ・マイク（AI）が、今日とくに読んでおきたいものを選びました" : "注目度の高い順に選びました"}</small></div>
      <div class="picks-grid">${picks.items.map((n, i) => `
        <button class="pk${i === 0 ? " first" : ""}" data-open="${n.id}" style="--c:${color(n.genre)}">
          <span class="num">${i + 1}</span>
          <span class="ph">${n.image ? `<img src="${esc(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}${n.kind === "video" ? '<span class="vid">▶ 動画</span>' : ""}</span>
          <span class="tx">
            <span class="g">${esc(genres.find((g) => g.id === n.genre)?.icon || "")} ${esc(genreLabel(n.genre))} ・ ${esc(n.publisher)}${isRead(n) ? " ・ ✓ 読んだ" : ""}</span>
            <span class="tt">${esc(n.title)}</span>
            ${n.reason ? `<span class="why"><b>なぜ今日？</b>${esc(n.reason)}</span>` : n.explanation ? `<span class="why">${esc(n.explanation.oneLine)}</span>` : ""}
          </span>
        </button>`).join("")}</div>
    </div>`;
  }

  async function loadPicks() {
    try {
      const res = await apiFetch("/api/picks");
      const d = await res.json();
      if (!res.ok) throw new Error(d.error);
      picks = d;
    } catch {
      picks = { items: [] };
    }
    render();
  }

  // ===== 解説ポップアップ =====
  function openModal(id) {
    current = id;
    modalFresh = true;
    markRead(id);
    renderModal();
    loadFullFor(id);
    $("shade").classList.add("show");
    $("modal").classList.add("show");
    document.body.classList.add("modal-open");
    if ($("modalScroll")) $("modalScroll").scrollTop = 0;
    const n = findItem(id);
    if (n && !n.explanation && ai.enabled && !making.has(String(id))) makeExplanation(id);
  }

  function closeModal() {
    current = null;
    setTimeout(render, 50); // 既読マークを反映
    $("shade").classList.remove("show");
    $("modal").classList.remove("show");
    document.body.classList.remove("modal-open");
  }

  // ===== 深掘り質問（記事ごとに会話を覚えておく） =====
  const askThreads = new Map(); // 記事ID → [{ role, content, followups? , error? }]
  let askBusy = false;
  const ASK_STARTERS = ["これって私の生活にどう影響する？", "もっとかんたんに教えて", "お客様に聞かれたらどう答える？", "むずかしい言葉をくわしく"];

  function askHtml(n) {
    const thread = askThreads.get(String(n.id)) || [];
    const last = [...thread].reverse().find((m) => m.role === "assistant");
    const sugs = thread.length ? last?.followups || [] : ASK_STARTERS;
    return `<div class="ask">
      <div class="ask-top">${mascot("bob")}<div><h3 class="ask-h">コーチ・マイクに深掘り質問</h3><p>この${n.kind === "video" ? "動画" : "記事"}について、なんでも聞いてくれ！ナイス質問、待ってるぜ！</p></div></div>
      ${thread.length ? `<div class="ask-log">${thread.map((m) => m.role === "user"
        ? `<div class="q-me">${esc(m.content)}</div>`
        : `<div class="a-bot${m.error ? " err" : ""}">${mascot()}<div>${esc(m.content)}</div></div>`).join("")}
        ${askBusy ? `<div class="a-bot">${mascot("talk")}<div><span class="dots"><span></span><span></span><span></span></span> 考え中…ちょっと待ってくれ！</div></div>` : ""}</div>` : ""}
      ${sugs.length && !askBusy ? `<div class="ask-sugs">${sugs.map((q) => `<button data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>` : ""}
      <form class="ask-form" data-askform><input id="askInput" placeholder="例：なぜ今このニュースが大事なの？" maxlength="200" autocomplete="off"><button ${askBusy ? "disabled" : ""}>聞く</button></form>
      <div class="ask-note">※ マイクは記事のタイトル・冒頭（動画は概要欄）と解説だけを読んで答えます。大事な数字は元の${n.kind === "video" ? "動画" : "記事"}で確かめてね。</div>
    </div>`;
  }

  async function askArticle(text) {
    text = String(text || "").trim();
    const id = current;
    if (!text || askBusy || !id) return;
    const key = String(id);
    const thread = askThreads.get(key) || [];
    thread.push({ role: "user", content: text });
    askThreads.set(key, thread);
    askBusy = true;
    if ($("askInput")) $("askInput").value = "";
    renderModal();
    document.querySelector(".ask-log")?.lastElementChild?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    try {
      const res = await apiFetch("/api/ask", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, messages: thread.filter((m) => !m.error).map(({ role, content }) => ({ role, content })) }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "うまく答えられませんでした");
      thread.push({ role: "assistant", content: data.answer, followups: data.followups });
    } catch (e) {
      thread.push({ role: "assistant", content: e.message, error: true });
    }
    askBusy = false;
    if (String(current) === key) {
      renderModal();
      document.querySelector(".ask-log")?.lastElementChild?.scrollIntoView({ block: "nearest", behavior: "smooth" });
      $("askInput")?.focus();
    }
  }

  // あわせて読みたい：同じジャンルの、まだ読んでいない記事を優先して3本
  function relatedHtml(n) {
    const cands = pool().filter((x, i, a) => !sameId(x, n.id) && a.findIndex((y) => sameId(y, x.id)) === i);
    const rel = cands.filter((x) => x.genre === n.genre)
      .sort((a, b) => (isRead(a) - isRead(b)) || (new Date(b.publishedAt) - new Date(a.publishedAt))).slice(0, 3);
    if (!rel.length) return "";
    return `<div class="blk"><h3>あわせて読みたい</h3><div class="next">${rel.map((x) => `
      <button data-open="${x.id}">
        ${x.image ? `<img src="${esc(x.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
        <span>${esc(x.title)}${isRead(x) ? " ✓" : ""}</span>
      </button>`).join("")}</div></div>`;
  }

  function renderModal() {
    const n = findItem(current);
    if (!n) return closeModal();
    const partial = n.explanation?.partial; // スマホ版：全文をまだ読み込んでいない
    const e = partial || n.explanation?.missing ? null : n.explanation;
    const head = (n.image ? `<div class="m-cover" style="background-image:url('${esc(n.image)}')"></div>` : "") + `
      <div class="m-head" style="--c:${color(n.genre)}">
        <div class="meta"><b>${esc(genreLabel(n.genre))}</b> ・ ${esc(n.publisher)} ・ ${esc(new Date(n.publishedAt).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }))}</div>
        <h2 id="m-title">${esc(n.title)}</h2>
        <div class="m-actions">
          <a class="btn primary" href="${esc(n.url)}" target="_blank" rel="noopener">${n.kind !== "video" ? "元の記事を読む ↗" : String(n.id).startsWith("pv-") ? "PIVOTで見る ↗" : "YouTubeで見る ↗"}</a>
          <button class="btn" data-star="${n.id}" aria-pressed="${n.saved}">${n.saved ? "★ 保存済み" : "☆ 保存する"}</button>
        </div>
      </div>`;

    let body;
    if (e) {
      const list = (t) => `<ul>${sentences(t).map((s) => `<li>${esc(s)}</li>`).join("")}</ul>`;
      // 長い文章は1文ずつ段落に分ける（スマホの細い画面で、文字のかたまりにならないように）
      const paras = (t, cls = "") => `<div class="para ${cls}">${sentences(t).map((s) => `<p>${esc(s)}</p>`).join("")}</div>`;
      // 見出しへ飛ぶボタン（解説が長いので、読みたいところへすぐ行けるように）
      const secs = [
        e.points?.length && ["pts", "📌", "ポイント"], e.background && ["bg", "🧭", "背景"], ["easy", "💡", "かんたん"], ["life", "🏠", "影響"],
        e.views?.length && ["views", "💬", "視点"], ["talk", "🗣", "お客様へ"], e.terms.length && ["terms", "📖", "ことば"],
      ].filter(Boolean);
      body = `
        <div class="m-body${modalFresh ? " anim" : ""}" style="--c:${color(n.genre)}">
          <div class="hero">${esc(e.oneLine)}</div>
          <nav class="sec-nav" aria-label="解説の目次">${secs.map(([id, icon, label]) => `<button data-jump="${id}"><span class="ic">${icon} </span>${label}</button>`).join("")}</nav>
          ${e.points?.length ? `<div class="blk sec" id="sec-pts"><h3>📌 記事のポイント</h3><ol class="pts">${e.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ol></div>` : ""}
          ${e.background ? `<div class="blk sec" id="sec-bg"><h3>🧭 背景・しくみ</h3>${paras(e.background)}</div>` : ""}
          <div class="blk sec" id="sec-easy"><h3>💡 かんたんに言うと</h3>${e.points?.length ? paras(e.simple, "soft") : list(e.simple)}</div>
          <div class="blk sec" id="sec-life"><h3>🏠 くらし・お金への影響</h3>${list(e.impact)}</div>
          ${e.views?.length ? `<div class="blk sec" id="sec-views"><h3>💬 NewsPicks のコメントから見える視点 <small>（意見です）</small></h3>${e.views.map((v) => `<blockquote class="view">${esc(v)}</blockquote>`).join("")}</div>` : ""}
          <div class="blk sec" id="sec-talk"><h3>🗣 お客様にはこう話す</h3>
            <div class="bubble"><button class="btn copy" data-copy>コピー</button>${sentences(e.customerTalk).map((s) => `<p>${esc(s)}</p>`).join("")}</div>
          </div>
          ${e.terms.length ? `<div class="blk sec" id="sec-terms"><h3>📖 ことばメモ</h3><div class="terms">${e.terms.map((t) => `<div class="term"><b>${esc(t.term)}</b>${esc(t.meaning)}</div>`).join("")}</div></div>` : ""}
          ${askHtml(n)}
          ${relatedHtml(n)}
          <div class="blk"><h3>こんなお客様に役立つ</h3><div class="whos">${(n.audiences || []).map((a) => `<span class="who">${audiences.find((x) => x.id === a)?.icon || ""} ${esc(audLabel(a))}</span>`).join("")}</div></div>
          <div class="note">※ ${esc(new Date(e.generatedAt).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }))} に${e.source === "sarashina" ? "Sarashina（AI）" : "Claude"}が、${n.kind === "video" ? "動画のタイトルと概要欄から作った解説です（動画の中身は見ていません）。くわしくは動画で確認してください"
  : e.basis === "body" ? `記事の本文${e.views?.length ? "と NewsPicks のコメント" : ""}を読んで作った解説です。大事な数字は元の記事でも確認してください`
  : "記事のタイトルと冒頭文だけから作った解説です（本文は取得できませんでした）。詳細は元の記事で確認してください"}。</div>
        </div>`;
    } else {
      const m = making.get(String(n.id));
      body = `<div class="m-wait">${
        partial ? `解説を読み込んでいます <span class="dots"><span></span><span></span><span></span></span>`
        : m === "loading" ? `AIが解説を書いています <span class="dots"><span></span><span></span><span></span></span>
          <div class="skel"><i style="width:70%"></i><i></i><i style="width:90%"></i><i style="width:60%"></i></div>`
        : !ai.enabled ? "解説はまだありません。<br>.env に Sarashina の APIキーを設定すると自動で作られます。"
        : `解説はまだありません。<br><button class="btn primary" data-make style="margin-top:12px">いま解説を作る</button>${m ? `<span class="err">${esc(m)}</span>` : ""}`
      }</div>`;
    }
    const top = $("modalScroll")?.scrollTop || 0; // 裏で一覧が更新されても読んでいる位置を保つ
    const typing = $("askInput")?.value || "";
    const focused = document.activeElement?.id === "askInput";
    $("modal").innerHTML = `<button class="close" data-close aria-label="閉じる">×</button><div class="m-scroll" id="modalScroll">${head}${body}</div>`;
    $("modalScroll").scrollTop = modalFresh ? 0 : top;
    if ($("askInput")) { $("askInput").value = typing; if (focused) $("askInput").focus(); }
    if (e) modalFresh = false;
  }

  async function makeExplanation(id) {
    id = String(id);
    making.set(id, "loading");
    render();
    try {
      const res = await apiFetch("/api/explain", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "解説の作成に失敗しました");
      making.delete(id);
      // スマホ版の解説には audiences（お客様のタイプ）が入っていないので、あるものだけ書きかえる
      for (const n of pool()) if (sameId(n, id)) Object.assign(n, { explanation: data, ...(data.genre && { genre: data.genre }), ...(Array.isArray(data.audiences) && { audiences: data.audiences }) });
    } catch (e) {
      making.set(id, e.message);
    }
    render();
  }

  // ===== 保存 =====
  async function toggleSave(id) {
    const target = findItem(id);
    if (!target) return;
    const save = !target.saved;
    for (const n of pool()) if (sameId(n, id)) n.saved = save;
    burstId = String(id);
    setTimeout(() => { burstId = null; }, 700);
    render();
    toast(save ? "★ 保存しました" : "保存をやめました");
    try {
      const res = await apiFetch("/api/saved", {
        method: save ? "POST" : "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }),
      });
      if (!res.ok) throw new Error((await res.json()).error || "保存に失敗しました");
    } catch (e) {
      for (const n of pool()) if (sameId(n, id)) n.saved = !save;
      alert(e.message);
    }
    await loadSaved();
    render();
  }

  // ===== 読み込み =====
  async function load(force, animate = true) {
    animateNext = animateNext || animate;
    $("status").textContent = "取得中…";
    if (!items.length) $("list").innerHTML = Array.from({ length: 6 }, () =>
      `<div class="sk-card"><i style="width:30%"></i><i style="width:90%"></i><i style="width:70%"></i></div>`).join("");
    try {
      const res = await apiFetch(`/api/news?category=${encodeURIComponent($("cat").value)}` + (force ? "&refresh" : ""));
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      items = data.items;
      genres = data.genres;
      audiences = data.audiences;
      warning = data.warning;
      ai = data.ai;
      $("status").textContent = `${items.length}件` +
        (data.fetchedAt ? ` ・ ${new Date(data.fetchedAt).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })} 更新` : "") +
        (ai.queued ? ` ・ AI解説 作成中（あと${ai.queued}件）` : "");
      if (ai.queued) $("status").insertAdjacentHTML("afterbegin", '<span class="pulse"></span>');
      render();
    } catch (e) {
      $("status").textContent = "";
      $("list").innerHTML = `<div class="error">${esc(e.message)}</div>`;
    } finally {
      scheduleNext();
    }
  }

  async function loadSaved() {
    try {
      const data = await (await apiFetch("/api/saved")).json();
      savedItems = data.items;
      ai = data.ai;
      genres = data.genres;
      audiences = data.audiences;
    } catch {}
  }

  async function loadCategories() {
    try {
      const cats = await (await apiFetch("/api/categories")).json();
      $("cat").innerHTML = cats.map((c) => `<option value="${esc(c.id)}">${esc(c.label)}</option>`).join("");
    } catch {}
  }

  // AI解説の作成待ちがある間は30秒ごと、ないときは5分ごとに読み直す
  let timer;
  function scheduleNext() {
    clearTimeout(timer);
    timer = setTimeout(() => (view === "saved" ? loadSaved().then(render) : load(false, false)), ai.queued ? 30000 : 5 * 60 * 1000);
  }

  // ===== AIチャット =====
  const chatHistory = []; // [{ role, content }]
  const SUGGEST = ["金利が上がると何が変わる？", "NISAは何から始める？", "円安って結局いいこと？", "老後のお金が不安", "最近の日銀の動きを知りたい"];

  function chatScroll() { const l = $("chatLog"); l.scrollTop = l.scrollHeight; }

  function chatAdd(html) {
    $("chatLog").insertAdjacentHTML("beforeend", html);
    chatScroll();
  }

  function openChat() {
    $("chat").classList.add("show");
    $("chatFab").classList.add("hidden");
    if (!$("chatLog").children.length) {
      chatAdd(`<div class="row-bot">${mascot()}<div class="msg bot">Hey！コーチ・マイクだ！ お金や経済のこと、なんでも質問してくれ。わかりやすく答えて、関係するニュースやYouTube動画も探してくるぜ。Let's go！</div></div>
        <div class="c-sugs">${SUGGEST.map((q) => `<button data-ask="${esc(q)}">${esc(q)}</button>`).join("")}</div>`);
    }
    setTimeout(() => $("chatInput").focus(), 300);
  }

  function closeChat() {
    $("chat").classList.remove("show");
    $("chatFab").classList.remove("hidden");
  }

  function resultHtml(n, i) {
    return `<button class="c-item" data-open="${n.id}" style="animation-delay:${i * 70}ms">
      ${n.image ? `<img src="${esc(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
      <span><span class="tt"><span class="k${n.kind === "video" ? " v" : ""}">${n.kind === "video" ? "動画" : "記事"}</span>${esc(n.title)}</span>
      ${n.reason ? `<span class="why">${esc(n.reason)}</span>` : ""}</span>
    </button>`;
  }

  async function ask(text) {
    text = text.trim();
    if (!text || $("chatSend").disabled) return;
    $("chatInput").value = "";
    $("chatSend").disabled = true;
    document.querySelectorAll(".c-sugs").forEach((x) => x.remove());
    chatAdd(`<div class="msg me">${esc(text)}</div>`);
    chatHistory.push({ role: "user", content: text });
    chatAdd(`<div class="row-bot" id="typing">${mascot("talk")}<div class="msg bot"><span class="dots"><span></span><span></span><span></span></span> マイクが全力で考えてるぜ…</div></div>`);
    try {
      const res = await apiFetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: chatHistory }) });
      const data = await res.json();
      $("typing")?.remove();
      if (!res.ok) throw new Error(data.error || "うまく探せませんでした");
      for (const n of data.items) if (!chatItems.some((x) => sameId(x, n.id))) chatItems.push(n);
      const answer = data.answer || "";
      chatHistory.push({ role: "assistant", content: [answer, data.reply].filter(Boolean).join("\n") + (data.items.length ? "\n紹介したもの: " + data.items.map((n) => n.title).join(" / ") : "") });
      // まず質問への答え、そのあとに「関連する記事・動画」を出す
      chatAdd((answer ? `<div class="row-bot">${mascot()}<div class="msg bot answer">${esc(answer)}</div></div>` : "") +
        (data.items.length
          ? `${answer ? `<div class="c-rel">📚 もっと知りたいなら、これを読んでくれ！</div>` : `<div class="row-bot">${mascot()}<div class="msg bot">${esc(data.reply)}</div></div>`}
             <div class="c-results">${data.items.map(resultHtml).join("")}</div>`
          : answer ? "" : `<div class="row-bot">${mascot()}<div class="msg bot">${esc(data.reply)}</div></div>`));
      if (answer || data.items.length) chatAdd(`<div class="c-sugs"><button data-ask="もっとかんたんに説明して">もっとかんたんに</button><button data-ask="お客様にはどう説明すればいい？">お客様への説明</button><button data-ask="これについて動画で知りたい">動画で知りたい</button></div>`);
    } catch (e) {
      $("typing")?.remove();
      chatAdd(`<div class="row-bot">${mascot()}<div class="msg bot err">${esc(e.message)}</div></div>`);
      chatHistory.pop();
    } finally {
      $("chatSend").disabled = false;
      $("chatInput").focus();
    }
  }

  $("chatFab").addEventListener("click", openChat);
  $("chatClose").addEventListener("click", closeChat);
  $("chatForm").addEventListener("submit", (ev) => { ev.preventDefault(); ask($("chatInput").value); });
  $("chatLog").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-ask]");
    if (b) ask(b.dataset.ask);
  });

  // ===== 日米の金利 =====
  function spark(history) {
    const h = (history || []).slice(-30);
    if (h.length < 2) return "";
    const min = Math.min(...h), max = Math.max(...h), span = max - min || 1;
    const pts = h.map((v, i) => [(i / (h.length - 1)) * 100, 20 - ((v - min) / span) * 18]);
    const last = pts.at(-1);
    return `<svg viewBox="0 0 100 22" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.map((p) => p.map((x) => x.toFixed(1)).join(",")).join(" ")}"/><circle cx="${last[0]}" cy="${last[1]}" r="2"/></svg>`;
  }

  // 国旗（Windows では国旗の絵文字が表示されないので絵で描く）
  const FLAG_JP = `<svg class="flag" viewBox="0 0 30 20" aria-label="日本"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#bc002d"/></svg>`;
  const FLAG_US = `<svg class="flag" viewBox="0 0 30 20" aria-label="アメリカ"><rect width="30" height="20" fill="#b22234"/>${[1, 3, 5, 7, 9, 11].map((i) => `<rect y="${(i * 20) / 13}" width="30" height="${20 / 13}" fill="#fff"/>`).join("")}<rect width="13" height="${(7 * 20) / 13}" fill="#3c3b6e"/></svg>`;

  function rateItem(label, r, { range, noSpark, tip } = {}) {
    if (!r) return `<div class="ri"><div class="k">${label}</div><div class="v">—</div></div>`;
    const ch = r.change;
    const bp = ch == null ? null : Math.round(ch * 100); // 0.01% = 1bp
    const cls = bp == null || bp === 0 ? "flat" : bp > 0 ? "up" : "down";
    const delta = bp == null ? "" : `<span class="d ${cls}">${bp > 0 ? "▲" : bp < 0 ? "▼" : "→"} ${Math.abs(ch).toFixed(3).replace(/0+$/, "").replace(/\.$/, "")}</span>`;
    const value = range ? `${r.lower.toFixed(2)}〜${r.upper.toFixed(2)}` : r.value.toFixed(r.value < 10 ? 3 : 2).replace(/0$/, "");
    return `<div class="ri" title="${esc(tip || label)}（${esc(r.date)}時点）">
      <div class="k">${label}</div>
      <div class="v${range ? " range" : ""}">${value}<small>%</small></div>
      ${range ? `<span class="d flat">${esc(r.date.slice(5).replace("-", "/"))}時点</span>` : delta}
      ${noSpark ? "" : spark(r.history)}
    </div>`;
  }

  // ドル円（1ドル何円か）。数字が上がる＝円安、下がる＝円高
  function fxCard(r) {
    if (!r) return `<div class="rate-card fx"><h4>💵 ドル円</h4><div class="ri"><div class="v">—</div></div></div>`;
    const ch = r.change ?? 0;
    const cls = ch === 0 ? "flat" : ch > 0 ? "up" : "down";
    const word = ch > 0 ? "円安" : ch < 0 ? "円高" : "変わらず";
    return `<div class="rate-card fx" title="1ドルを買うのに何円いるか（${esc(r.date)}時点・欧州中央銀行の参照レート）。数字が上がると円安、下がると円高">
      <h4>💵 ドル円 <small>${esc(r.date.slice(5).replace("-", "/"))}時点</small></h4>
      <div class="ri">
        <div class="k">1ドル ＝</div>
        <div class="v">${r.value.toFixed(2)}<small>円</small></div>
        <span class="d ${cls}">${ch > 0 ? "▲" : ch < 0 ? "▼" : "→"} ${Math.abs(ch).toFixed(2)}円 ${word}</span>
        ${spark(r.history)}
      </div>
    </div>`;
  }

  function renderRates(d) {
    const jp = d.jp, us = d.us;
    const latestJp = [jp.y10?.date, jp.y2?.date].filter(Boolean).sort().at(-1);
    const latestUs = [us.y10?.date, us.y2?.date].filter(Boolean).sort().at(-1);
    const md = (x) => (x ? x.slice(5).replace("-", "/") : "");
    const gap = jp.y10 && us.y10 ? us.y10.value - jp.y10.value : null;
    $("rates").innerHTML = `
      <div class="rate-card">
        <h4>${FLAG_JP} 日本 <small>${md(latestJp)}時点</small></h4>
        <div class="rate-items">
          ${rateItem("政策金利", jp.policy, { tip: "無担保コール翌日物レート（日銀が誘導目標にしている金利）" })}
          ${rateItem("国債2年", jp.y2)}
          ${rateItem("国債10年", jp.y10)}
        </div>
      </div>
      <div class="rate-card">
        <h4>${FLAG_US} アメリカ <small>${md(latestUs)}時点</small></h4>
        <div class="rate-items">
          ${rateItem("政策金利", us.policy, { range: true, noSpark: true, tip: "FF金利の誘導目標（FRBが決める範囲）" })}
          ${rateItem("国債2年", us.y2)}
          ${rateItem("国債10年", us.y10)}
        </div>
      </div>
      <div class="fx-col">
        ${fxCard(d.fx?.usdjpy)}
        <div class="rate-card spread" title="アメリカの10年国債と日本の10年国債の利回りの差。差が大きいほど円安になりやすいと言われます">
          <div class="k">日米金利差（10年）</div>
          <div class="v">${gap == null ? "—" : gap.toFixed(2) + "%"}</div>
          <div class="s">差が大きいほど<br>円安になりやすい</div>
        </div>
      </div>
      <div class="rates-note">※ 日本銀行・財務省・FRED（米セントルイス連銀）・ECB（欧州中央銀行）の公開データ。1日1回の更新で、前の営業日との差を表示しています。${d.errors?.length ? " 一部取得できませんでした：" + esc(d.errors.join(" / ")) : ""}</div>`;
  }

  async function loadRates() {
    try {
      const res = await apiFetch("/api/rates");
      const d = await res.json();
      if (!res.ok) throw new Error(d.error);
      renderRates(d);
    } catch (e) {
      $("rates").innerHTML = `<div class="rates-note">金利を取得できませんでした（${esc(e.message)}）</div>`;
    }
  }
  loadRates();
  setInterval(loadRates, 30 * 60 * 1000);
  loadPicks();
  setInterval(loadPicks, 30 * 60 * 1000);

  // ===== スマホで見る：同じ Wi-Fi のスマホから開くためのQRコード =====
  // このPCで開いているときだけボタンを出す（スマホで開いているときは不要）
  if (!STATIC && ["localhost", "127.0.0.1", "::1"].includes(location.hostname)) $("phoneBtn").hidden = false;

  async function openPhone() {
    let urls = [];
    try { urls = (await (await apiFetch("/api/lan")).json()).urls; } catch {}
    const url = urls[0];
    let qr = "";
    try {
      const q = qrcode(0, "M"); // eslint-disable-line no-undef
      q.addData(url); q.make();
      qr = q.createSvgTag({ cellSize: 5, margin: 2, scalable: true });
    } catch {}
    $("phone").innerHTML = url ? `
      <button class="x" data-phone-close aria-label="閉じる">×</button>
      <h3>📱 スマホで見る</h3>
      <p>このPCと<b>同じWi-Fi</b>につないだスマホで、カメラでQRコードを読み取ってください。</p>
      ${qr ? `<div class="qr">${qr}</div>` : ""}
      <div class="url">${esc(url)}</div>
      <ol>
        <li>開いたら、共有ボタン（iPhone）またはメニュー（Android）から「<b>ホーム画面に追加</b>」</li>
        <li>ホーム画面のマイクのアイコンから、アプリのように開けます</li>
        <li>見られるのは、このPCでアプリが起動しているときだけです</li>
      </ol>`
      : `<button class="x" data-phone-close aria-label="閉じる">×</button><h3>📱 スマホで見る</h3><p>Wi-Fi のアドレスが見つかりませんでした。PCが Wi-Fi につながっているか確認してください。</p>`;
    $("phone").classList.add("show");
    $("shade").classList.add("show");
  }
  function closePhone() {
    $("phone").classList.remove("show");
    if (!current) $("shade").classList.remove("show");
  }
  $("phoneBtn").addEventListener("click", openPhone);
  $("phone").addEventListener("click", (ev) => { if (ev.target.closest("[data-phone-close]")) closePhone(); });
  $("shade").addEventListener("click", closePhone);

  // ===== 操作 =====
  $("views").addEventListener("click", async (ev) => {
    const b = ev.target.closest("button[data-view]");
    if (!b) return;
    view = b.dataset.view;
    genre = "all";
    animateNext = true;
    resetShown();
    if (view === "saved") await loadSaved();
    render();
    window.scrollTo({ top: 0 });
  });
  $("filters").addEventListener("click", (ev) => {
    const t = ev.target.closest("[data-fopen]");
    if (t) {
      openFilter = openFilter === t.dataset.fopen ? null : t.dataset.fopen;
      return renderFilters(filtered());
    }
    const b = ev.target.closest("button.chip");
    if (!b) return;
    openFilter = null; // 選んだら一覧を閉じる
    if (b.dataset.aud) {
      audience = b.dataset.aud;
      try { localStorage.setItem("audience", audience); } catch {}
    }
    if (b.dataset.genre) genre = b.dataset.genre;
    animateNext = true;
    resetShown();
    render();
  });
  // 絞り込みの一覧の外をタップしたら閉じる
  document.addEventListener("click", (ev) => {
    // composedPath を使う（ボタンを押すと絞り込み欄が描き直されて、押した要素が画面から外れるため）
    if (openFilter && !ev.composedPath().some((el) => el.id === "filters")) { openFilter = null; renderFilters(filtered()); }
  });
  // ランキング・あわせて読みたい・チャットからポップアップを開く
  document.addEventListener("click", (ev) => {
    const o = ev.target.closest("[data-open]");
    if (o) { ev.stopPropagation(); openModal(o.dataset.open); }
  }, true);
  $("list").addEventListener("click", (ev) => {
    if (ev.target.closest("[data-open]")) return;
    const more = ev.target.closest("[data-more]");
    if (more) {
      const g = more.dataset.more;
      const before = shown.get(g) || firstCount();
      shown.set(g, before + 12);
      render();
      // 増えた分のカードをふわっと出す
      const sec = document.querySelector(`#list section[data-g="${g}"]`);
      sec?.querySelectorAll(".card").forEach((c, i) => { if (i >= before) { c.classList.add("enter"); c.style.setProperty("--i", i - before); } });
      return;
    }
    const star = ev.target.closest("[data-star]");
    if (star) return toggleSave(star.dataset.star);
    const card = ev.target.closest(".card");
    if (card) openModal(card.dataset.id);
  });
  $("list").addEventListener("keydown", (ev) => {
    const card = ev.target.closest(".card");
    if (card && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); openModal(card.dataset.id); }
  });
  $("modal").addEventListener("submit", (ev) => {
    if (!ev.target.closest("[data-askform]")) return;
    ev.preventDefault();
    askArticle($("askInput")?.value);
  });
  $("modal").addEventListener("click", async (ev) => {
    if (ev.target.closest("[data-open]")) return;
    const q = ev.target.closest("[data-q]");
    if (q) return askArticle(q.dataset.q);
    if (ev.target.closest("[data-close]")) return closeModal();
    const star = ev.target.closest("[data-star]");
    if (star) return toggleSave(star.dataset.star);
    if (ev.target.closest("[data-make]")) return makeExplanation(current);
    const jump = ev.target.closest("[data-jump]");
    if (jump) {
      const sec = $("sec-" + jump.dataset.jump), box = $("modalScroll");
      if (sec && box) box.scrollTo({ top: sec.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - 12, behavior: "smooth" });
      return;
    }
    const copy = ev.target.closest("[data-copy]");
    if (copy) {
      const text = findItem(current)?.explanation?.customerTalk || "";
      try { await navigator.clipboard.writeText(text); copy.textContent = "✓ コピーしました"; copy.classList.add("done"); toast("お客様向けの例文をコピーしました"); }
      catch { copy.textContent = "コピーできませんでした"; }
      setTimeout(() => { if (copy.isConnected) { copy.textContent = "コピー"; copy.classList.remove("done"); } }, 2000);
    }
  });
  $("shade").addEventListener("click", closeModal);
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && current) closeModal(); });
  // 動画（YouTube・PIVOT）は全部の動画、ニュースは1か月分を最初に表示する
  $("cat").addEventListener("change", () => {
    const yt = $("cat").value.startsWith("yt-") || $("cat").value === "pivot";
    if (yt) $("period").value = "all";
    else if ($("period").value === "all") $("period").value = "31";
    genre = "all";
    resetShown();
    load(false);
  });
  ["sort", "period"].forEach((id) => $(id).addEventListener("input", () => { animateNext = true; resetShown(); render(); }));
  $("q").addEventListener("input", () => { resetShown(); render(); });
  $("logo").innerHTML = mascot("bob");
  $("fabOwl").innerHTML = mascot("bob");
  $("chatAv").innerHTML = mascot();
  // 今日の日付と「上に戻る」ボタン
  $("today").textContent = new Date().toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday: "short" }) + "のニュース";
  window.addEventListener("scroll", () => $("totop").classList.toggle("show", window.scrollY > 600), { passive: true });
  $("totop").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
  Promise.all([loadCategories(), loadSaved()]).then(() => load(false));
</script>
</body>
</html>
