# 2時間ごとに、記事・動画・AI解説・金利・おすすめ5選を更新して、スマホ用サイトを作り直す
#   - これまでのデータは「state」ブランチに置いておき、毎回取り出して続きから更新する
#   - できあがったサイトは Cloudflare Pages（kinyu-viewer.pages.dev）に置く
#   - AI（Sarashina）は GitHub のサーバーからの接続を断るので、Cloudflare の中継（/api/ai）を通して呼ぶ
# 必要な Secrets（GitHub の Settings → Secrets and variables → Actions）:
#   SARASHINA_API_KEY    … AI 解説を作る
#   YOUTUBE_API_KEY      … YouTube の過去の動画を全部取る
#   CLOUDFLARE_API_TOKEN … サイトを Cloudflare に置く

name: 更新（記事・動画・AI解説）

on:
  schedule:
    - cron: "7 */2 * * *" # 2時間ごと（日本時間の奇数時台）
  workflow_dispatch: {} # Actions の画面から手動でも動かせる

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE_URL: https://kinyu-viewer.pages.dev
      CLOUDFLARE_ACCOUNT_ID: 64977e125319b69323a8c9ff8da78202
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: これまでのデータを取り出す
        run: |
          mkdir -p data
          if git fetch --depth=1 origin state 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C data
            echo "前回までのデータを読み込みました"
          else
            echo "初回なので、データなしで始めます"
          fi

      - name: 記事・動画を集めて、AI 解説を作る
        run: node scripts/update.js
        env:
          SARASHINA_API_KEY: ${{ secrets.SARASHINA_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Sarashina は日本の外からの接続を断るので、東京に固定した Cloudflare Workers（worker フォルダ）を通す
          AI_PROXY_URL: https://kinyu-ai-relay.kogaken0228.workers.dev
          AI_MINUTES: "8"

      - name: スマホ用サイトを作る
        run: node scripts/build-site.js

      - name: サイトを Cloudflare に置く
        id: deploy
        continue-on-error: true # 置けなくても、作った解説（データ）は必ず保存する
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::CLOUDFLARE_API_TOKEN がないので、サイトは置きません"; exit 0; fi
          cd site
          set +e
          npx --yes wrangler@3.80.0 pages deploy . --project-name kinyu-viewer --branch site --commit-dirty=true > ../deploy.log 2>&1
          code=$?
          # 結果の要点を「注釈」として残す（Actions の画面の上に出る。長い英数字は伏せ字）
          grep -E "Success|Deployment complete|ERROR|Error|error|code:|Authentication|permission" ../deploy.log \
            | sed -E 's/[A-Za-z0-9_-]{24,}/***/g' | head -8 | while read -r line; do echo "::warning title=Cloudflare::$line"; done
          exit $code

      - name: データを保存する
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data
          git init -q
          git checkout -q -b state
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "更新 $(date -u +%Y-%m-%dT%H:%MZ)"
          set +e
          # 毎回1つのコミットだけにして、履歴で容量が増えないようにする
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state > ../push.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            sed -E 's/[A-Za-z0-9_-]{24,}/***/g' ../push.log | tail -8 | while read -r line; do echo "::warning title=保存::$line"; done
          fi
          exit $code
